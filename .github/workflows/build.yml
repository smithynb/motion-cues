name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The project sets EnableWindowsTargeting, so Linux can build the Windows exe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: |
          mkdir -p release
          for rid in win-x64 win-arm64; do
            dotnet publish src/MotionCues.csproj -c Release -r "$rid" \
              --self-contained true -p:PublishSingleFile=true \
              -p:Version=${{ steps.version.outputs.value }} \
              -o "dist/$rid"
            cp "dist/$rid/MotionCues.exe" "release/MotionCues-$rid.exe"
          done
          cd release && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: MotionCues-${{ steps.version.outputs.value }}
          path: release/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Motion Cues ${TAG#v}" --generate-notes --verify-tag
          fi
